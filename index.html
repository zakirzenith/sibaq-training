<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DH BENGAL • Sibaq Trainer & Candidate Management</title>
  <meta name="description" content="DH BENGAL operations dashboard for managing candidates, trainers, and stage/non-stage programs with bulk Excel upload and interactive assignment." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="light-theme">
  <div class="app-container">
    <!-- Navigation Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="official-logo-wrap">
          <img src="/logo.png" alt="DH BENGAL Logo" class="sidebar-brand-logo" />
        </div>
        <div class="logo-text-wrap">
          <span class="logo-title">DH BENGAL</span>
          <span class="logo-subtitle">Sibaq Controller</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Operations</div>
        
        <a class="nav-item active" data-view="dashboard" id="navDashboard">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          </span>
          <span>Dashboard</span>
        </a>

        <a class="nav-item" data-view="candidates" id="navCandidates">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <span>Candidates</span>
          <span id="sidebarCandBadge" class="nav-item-badge">0</span>
        </a>

        <a class="nav-item" data-view="programs" id="navPrograms">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          </span>
          <span>Programs</span>
          <span id="sidebarProgBadge" class="nav-item-badge">0</span>
        </a>

        <a class="nav-item" data-view="trainers" id="navTrainers">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/><polyline points="12 11 12 14 15 14"/></svg>
          </span>
          <span>Trainers & Mentors</span>
          <span id="sidebarTrnBadge" class="nav-item-badge">0</span>
        </a>

        <div class="nav-section-title" style="margin-top: 18px;">Performance</div>

        <a class="nav-item" data-view="daily-progress" id="navDailyProgress">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          </span>
          <span>Daily Progress</span>
          <span id="sidebarMeetBadge" class="nav-item-badge" title="Meets logged today">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="saas-system-card">
          <div class="ssc-dot-row">
            <span class="status-pulse-dot"></span>
            <span class="ssc-title">Controller Active</span>
          </div>
          <div class="ssc-subtitle">11:59 PM Auto Cutoff</div>
        </div>
      </div>
    </aside>

    <!-- Main View Section -->
    <div class="app-main">
      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <div class="saas-breadcrumb-pill">
            <span class="text-muted">DH BENGAL</span>
            <span class="sb-sep">/</span>
            <strong id="topbarCurrentViewName" class="sb-active">Daily Progress</strong>
          </div>
          <div class="topbar-status-capsule">
            <span class="dot-stage"></span> Stage & Non-Stage Hub
          </div>
        </div>

        <div class="topbar-right">
          <!-- Backup / Data Management Menu Button -->
          <button id="btnDataManage" class="btn btn-secondary btn-sm" title="System Data Backup and Demo Options">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            System Data
          </button>

          <!-- Theme Switcher -->
          <button id="btnThemeToggle" class="btn btn-icon btn-sm" title="Toggle Light / Dark Theme">
            <span id="themeIcon">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </span>
          </button>

          <!-- User Pill -->
          <div class="saas-user-pill">
            <div class="sup-avatar" style="overflow: hidden; padding: 2px; background: #ffffff; border: 1px solid #e2e8f0;">
              <img src="/logo.png" alt="DH" style="width: 100%; height: 100%; object-fit: contain;" />
            </div>
            <div class="sup-info">
              <span class="sup-name">DH BENGAL</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main id="mainContent" class="main-view-container">
        <!-- Injected dynamically by main.js router -->
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
