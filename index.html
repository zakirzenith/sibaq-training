<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DH BENGAL • Sibaq Trainer & Candidate Management</title>
  <meta name="description" content="DH BENGAL operations dashboard for managing candidates, trainers, and stage/non-stage programs with bulk Excel upload and interactive assignment." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sibaq Mentoring" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="light-theme">
  <div class="app-container">
    <!-- Navigation Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="official-logo-wrap">
          <img src="/logo.png" alt="DH BENGAL Logo" class="sidebar-brand-logo" />
        </div>
        <div class="logo-text-wrap">
          <span class="logo-title">DH BENGAL</span>
          <span class="logo-subtitle">Sibaq Controller</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Operations</div>
        
        <a class="nav-item active" data-view="dashboard" id="navDashboard">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          </span>
          <span>Dashboard</span>
        </a>

        <a class="nav-item" data-view="candidates" id="navCandidates">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <span>Candidates</span>
          <span id="sidebarCandBadge" class="nav-item-badge">0</span>
        </a>

        <a class="nav-item" data-view="programs" id="navPrograms">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          </span>
          <span>Programs</span>
          <span id="sidebarProgBadge" class="nav-item-badge">0</span>
        </a>

        <a class="nav-item" data-view="trainers" id="navTrainers">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/><polyline points="12 11 12 14 15 14"/></svg>
          </span>
          <span>Trainers & Mentors</span>
          <span id="sidebarTrnBadge" class="nav-item-badge">0</span>
        </a>

        <div class="nav-section-title" style="margin-top: 18px;">Performance</div>

        <a class="nav-item" data-view="daily-progress" id="navDailyProgress">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          </span>
          <span>Daily Progress</span>
          <span id="sidebarMeetBadge" class="nav-item-badge" title="Meets logged today">0</span>
        </a>

        <a class="nav-item" data-view="reports" id="navReports">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </span>
          <span>Reports & Dossiers</span>
          <span id="sidebarReportBadge" class="nav-item-badge" style="background:#e0e7ff; color:#4338ca; font-weight: 800;">Dossier</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="sidebarBtnTrainerPortal" class="sidebar-portal-btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 12px; background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; margin-bottom: 10px; transition: all 0.15s ease;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
          <span>Trainer Portal Login</span>
        </button>

        <div class="saas-system-card">
          <div class="ssc-dot-row">
            <span class="status-pulse-dot"></span>
            <span class="ssc-title">Controller Active</span>
          </div>
          <div class="ssc-subtitle">11:59 PM Auto Cutoff</div>
        </div>
      </div>
    </aside>

    <!-- Main View Section -->
    <div class="app-main">
      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <!-- Mobile-only Brand Header -->
          <div class="mobile-topbar-brand">
            <img src="/logo.png" alt="Logo" class="mtb-logo" />
            <span class="mtb-title">SIBAQ MENTORING</span>
          </div>

          <!-- Desktop Breadcrumbs -->
          <div class="saas-breadcrumb-pill desktop-only-inline">
            <span class="text-muted">DH BENGAL</span>
            <span class="sb-sep">/</span>
            <strong id="topbarCurrentViewName" class="sb-active">Daily Progress</strong>
          </div>
          <div class="topbar-status-capsule desktop-only-inline">
            <span class="dot-stage"></span> Stage & Non-Stage Hub
          </div>
        </div>

        <div class="topbar-right">
          <!-- Trainer Portal Access Button (Desktop Only) -->
          <button id="btnTopTrainerPortal" class="btn btn-outline btn-sm desktop-only-btn" title="Trainer Sign In & Portal" style="font-weight: 700; border-color: #cbd5e1; gap: 6px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
            <span class="btn-trainer-portal-text">Trainer Portal</span>
          </button>


          <!-- PWA Install App Button (Auto-shows when installable) -->
          <button id="btnTopInstallApp" class="btn btn-sm btn-pwa-install-pill" title="Install Sibaq Mentoring as Web App" style="display: none; align-items: center; gap: 6px; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: #ffffff; border: none; font-weight: 700; font-size: 12px; border-radius: 999px; padding: 6px 12px; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25); cursor: pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span class="btn-install-text">Install App</span>
          </button>

          <!-- User Pill / Profile Circle (Clickable on both Phone & Desktop) -->
          <div class="saas-user-pill" id="topbarUserProfileBtn" role="button" tabindex="0" title="Profile & Session Info">
            <div class="sup-avatar" style="overflow: hidden; padding: 2px; background: #ffffff; border: 1px solid #e2e8f0;">
              <img src="/logo.png" alt="DH" style="width: 100%; height: 100%; object-fit: contain;" />
            </div>
            <div class="sup-info">
              <span class="sup-name">DH BENGAL</span>
            </div>
          </div>

          <!-- Official Sign Out Button (Desktop Only) -->
          <button id="btnTopLogout" class="btn btn-outline btn-sm desktop-only-btn" title="Sign Out of Session" style="font-weight: 700; border-color: #cbd5e1; color: #64748b; gap: 6px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            <span class="btn-logout-text">Sign Out</span>
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main id="mainContent" class="main-view-container">
        <!-- Injected dynamically by main.js router -->
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar (Phone Only < 768px) -->
    <nav class="app-mobile-nav" id="mobileNavBar">
      <button class="mobile-nav-btn active" data-view="dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        <span>Home</span>
      </button>

      <button class="mobile-nav-btn" data-view="candidates">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Candidates</span>
      </button>

      <button class="mobile-nav-btn" data-view="programs">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
        <span>Programs</span>
      </button>

      <button class="mobile-nav-btn" data-view="trainers">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/><polyline points="12 11 12 14 15 14"/></svg>
        <span>Trainers</span>
      </button>

      <button class="mobile-nav-btn" data-view="daily-progress">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>Check-In</span>
      </button>

      <button class="mobile-nav-btn" data-view="reports">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Reports</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
